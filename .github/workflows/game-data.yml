# Refuses the game's files (its executable, data, disc images, texture packs) in a push or a pull request:
# native/tools/check_game_data.py says which and why
name: No game files

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (pinned: Dependabot updates it)
      - run: python3 native/tools/check_game_data.py
