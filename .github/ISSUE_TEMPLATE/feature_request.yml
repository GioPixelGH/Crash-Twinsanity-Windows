name: Suggestion
description: An idea for the Windows port
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        By default the game stays as it was on the PS2. Changes come as options or as mods: see
        [Suggesting a feature](https://github.com/GioPixelGH/Crash-Twinsanity-Windows/blob/main/.github/CONTRIBUTING.md#suggesting-a-feature).
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should the port do, and why? Examples from other games or ports help.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is it?
      options:
        - "A PC option: how the game is shown, controlled or how fast it runs"
        - "A game option: changes the experience with the game's own content (off by default)"
        - "A mod: new or changed content (levels, characters, textures)"
        - "Not sure"
    validations:
      required: true
