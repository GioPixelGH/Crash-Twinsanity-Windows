name: Bug report
description: Something in the game or the program doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please never attach your disc image or the game's files.
  - type: input
    id: version
    attributes:
      label: Version
      description: >-
        The release you're playing. The first line of log.txt names it (from 1.0.13 on); otherwise right-click
        CrashTwinsanity.exe > Properties > Details.
      placeholder: "1.2.0"
    validations:
      required: true
  - type: input
    id: pc
    attributes:
      label: PC
      description: Windows or Linux version, graphics card and controller.
      placeholder: "Windows 11, NVIDIA GeForce RTX 3060, Xbox One controller"
  - type: dropdown
    id: disc
    attributes:
      label: Disc
      description: The disc image you play. From 1.4.0 on, Options > Game > Disc shows it.
      options:
        - "PAL (Europe/Australia, SLES-52568)"
        - "PAL, translated or modded"
        - "North American, version 2.00 (SLUS-20909)"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. Screenshots or a video help a lot.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where and how
      description: >-
        The level or area, what you were doing, and whether it happens again when you do the same thing.
      placeholder: "Cavern Catastrophe, on the first lift with Cortex tied to Crash: ..."
  - type: textarea
    id: options
    attributes:
      label: Options you changed
      description: >-
        Frame rate, resolution, v-sync, filtering, texture packs, mods, and any launch options or environment variables
        (such as TWIN_RENDER_THREAD=0).
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >-
        Drag log.txt here from %APPDATA%\Crash Twinsanity\ (paste that path in the Explorer's address bar; on Linux
        ~/.config/crash-twinsanity). After a crash or a freeze, start the game again and attach log.previous.txt too: that's
        the run that went wrong.
    validations:
      required: true
  - type: checkboxes
    id: copy
    attributes:
      label: Your copy of the game
      options:
        - label: I'm playing with a disc image of my own copy of Crash Twinsanity, the PAL release (SLES-52568) or the North American version 2.00 (SLUS-20909).
          required: true
